<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUTAYIEB — Multi-Agent Orchestration Engine</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#172033;--accent:#3b82f6;--success:#10b981;--danger:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.hleft{display:flex;align-items:center;gap:14px;}
#drawerToggle{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px;}
.brand{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;}
.hright{display:flex;align-items:center;gap:10px;}
#keyBtn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;}
#keyBtn.saved{color:var(--success);border-color:var(--success);}
.badge{background:rgba(16,185,129,.12color:var(--success);border:1px solid var(--success);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;}
.layout{display:flex;flex:1;overflow:hidden;}
#drawer{width:360px;min-width:360px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;transition:margin-left .25s;}
#drawer.closed{margin-left:-360px;}
.sect{padding:16px;border-bottom:1px solid var(--border);}
.stitle{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;font-weight:700;}
.maskrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.maskrow:hover,.maskrow.editing{border-color:var(--accent);}
.maskrow .t{font-size:14px;font-weight:600;}
.maskrow .s{font-size:11px;color:var(--muted);}
.maskrow button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;}
.maskrow button:hover{color:var(--danger);}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;width:100%;}
.btn:hover{background:#2563eb;}
.btn:disabled{background:#475569;cursor:not-allowed;}
.btn.g{background:var(--success);} .btn.g:hover{background:#0d9c6f;}
.btn.o{background:transparent;border:1px solid var(--border);color:var(--text);}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600;}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}
.acard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;}
.achd{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--accent);}
.achd button{background:transparent;border:none;color:var(--danger);cursor:pointer;}
.hint{font-size:11px;color:var(--muted);margin-top:4px;}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#pills{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--panel);flex-shrink:0;}
.pill{background:var(--panel2);border:1px solid(--border);color:var(--muted);border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
#transcript{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px;}
.empty{color:var(--muted);text-align:center;margin-top:60px;font-size:14px;}
.ubub{align-self:flex-end;background:var(--accent);color:#fff;padding:12px 16px;border-radius:14px 14px 2px 14px;max-width:70%;font-size:14px;}
.rblock{width:100%;}
.rtools{display:flex;justify-content:flex-end;margin-bottom:12px;}
.pdfbtn{background:var(--success);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;}
.aoutbackground:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto;max-height:520px;}
.aout .tt{font-size:13px;font-weight:800;color:var(--accent);}
.aout .mm{font-size:11px;color:var(--muted);margin-bottom:10px;}
.aout .bd{font-size:13px;line-height:1.6;}
.aout pre{background:#0b1220;padding:10px;border-radius:8px;overflow-x:auto;}
.aout code{background:#0b1220;padding:2px 5px;border-radius:4px;font-size:12px;}
.aout table{border-collapse:collapse;width:100%;}
.aout th,.aout td{border:1px solid var(--border);padding:6px 8px;font-size:12px;}
.err{color:var(--danger);font-size:12px;font-weight:600;}
.load{align-self:center;color:var(--accent);font-size:13px;font-weight:700;padding:10px 18px;background:var(--panel);border:1px solid var(--border);border-radius:20px;}
#pbar{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
#pin{flex:1;min-height:48px;max-height:140px;}
#sbtn{width:auto;padding:0 24px;flex-shrink:0;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hleft">
    <button id="drawerToggle">&#9776;</button>
    <div class="brand">MUTAYIEB</div>
  </div>
  <div class="hright">
    <button id="keyBtn">&#128273; Set API Key</button>
    <div class="badge">Universal Edge Engine</div>
  </div>
</header>
<div class="layout">
  <aside id="drawer">
    <div class="sect">
      <div class="stitle"> Management</div>
      <div id="maskList"></div>
      <button class="btn" id="newMaskBtn" style="margin-top:8px;">+ Create New Mask</button>
    </div>
    <div class="sect" id="editorSect" style="display:none;">
      <div class="stitle">Edit Mask</div>
      <label>Mask Title</label>
      <input type="text" id="mTitle">
      <label>Primary Objective / Global System Instruction</label>
      <textarea id="mGlobal"></textarea>
      <label>Custom API Key (Optional)</label>
      <input type="password" id="mKey" placeholder="Leave blank to use saved global key">
      <button class="btn o" id="syncBtn" style="margin-top:14px;">&#128260; Sync Models from OpenRouter</button>
      <div class="stitle" style="margin-top:16px;">Agents</div>
      <div id="agentsForm"></div>
      <div class="hint" id="aCount" style="text-align:center;margin-top:8px;"></div>
      <button class="btn" id="addAgentBtn" style="margin-top:10px;">+ Add Agent</button>
      <button class="btn g" id="saveMaskBtn" style="margin-top:14px;">Save Mask</button>
    </div>
  </aside>
  <main>
    <div id="pills"></div>
    <div id="transcript"><div class="empty" id="empty">Set your API key (top-right), then send a prompt to orchestrate all agents in parallel.</div></div>
    <div id="pbar">
      <textarea id="pin" placeholder="Enter your prompt for the active Mask's agent squad..."></textarea>
      <button class="btn" id="sbtn">Send Prompt</button>
    </div>
  </main>
</div>
</div>
<script>
(function(){
"use strict";
var SK='mutayieb_masks', AK='mutayieb_active', GK='mutayieb_global_key';
var MAXM=10, MAXA=10;
var DEFAULT_MODELS=['meta-llama/llama-3.3-70b-instruct:free','qwen/qwen-2.5-coder-32b-instruct:free','deepseek/deepseek-r1:free','google/gem-2.0-flash-lite-001','openai/gpt-4o-mini','anthropic/claude-3.5-sonnet','meta-llama/llama-3.1-8b-instruct:free','mistralai/mistral-7b-instruct:free'];
var state={masks:[],activeId:null,editingId:null,models:DEFAULT_MODELS.slice()};
function uid(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function $(id){return document.getElementById(id);}

/* ---------- API KEY (asked ONCE, saved in browser) ---------- */
function getGKey(){return localStorage.getItem(GK)||'';}
function keyFor(mask){if(mask&&mask.apiKey&&mask.apiKey.trim())return mask.apiKey.trim();return getGKey();}
function updKeyBtn(){var b=$('keyBtn');if(getGKey()){b.classList.add('saved');b.innerHTML='&#128273; Key Saved';}else{b.classList.remove('saved');b.innerHTML='&#128273; Set API Key';}}
$('keyBtn').onclick=function(){
  var k=prompt('Paste your OpenRouter API key.\nIt is saved ONLY in your browser (localStorage) and asked just:',getGKey());
  if(k===null)return;
  k=k.trim();
  if(k)localStorage.setItem(GK,k);else localStorage.removeItem(GK);
  updKeyBtn();
};

/* ---------- DEFAULT MASK ---------- */
function defaultMask(){
  return {id:uid(),title:'MUTAYIEB Master Engine',
 globalPrompt:'Perform an exhaustive, master-level structural and conceptual breakdown of the provided topic.',
    apiKey:'',
    agents:[
      {id:uid(),title:'Logic Expert',instructions:'You are Agent 1: Deep-Dive Logic & Concept Explanation Expert.',model:'meta-llama/llama-3.3-70b-instruct:free'},
      {id:uid(),title:'Mermaid Specialist',instructions:'You are Agent2: Mermaid Diagram & Mindmap Specialist. Always output valid ```mermaid code blocks for diagrams.',model:'qwen/qwen-2.5-coder-32b-instruct:free'},
      {id:uid(),title:'Architecture Specialist',instructions:'You are Agent 3: System & Structural Architecture Specialist.',model:'qwen/qwen-2.5-coder-32b-instruct:free'},
      {id:uid(),title:'Formula & Syntax Master',instructions:'You are Agent 4: Formula, Syntax & Cheat-Sheet Master.',model:'deepseek/deepseek-r1:free'},
      {id:uid(),title:'Exam & Practice Simulator',instructions:'You are Agent 5: Practice Questions, Edge Cases & Exam Simulator.',model:'google/gemini-2.0-flash-lite-001'}
    ]};
}
function load(){
  try{
    var raw=localStorage.getItem(SK);
    if(!raw){state.masks=[defaultMask()];state.activeId=state.masks[0].id;save();return;}
    state.masks=JSON.parse(raw)||[];
    if(!state.masks.length){state.masks=[defaultMask()];}
    var a=localStorage.getItem(AK);
    state.activeId=(a&&state.masks.some(function(m){return m.id===a;}))?a:state.masks[0].id;
  }catch(e){state.masks=[defaultMask()];state.activeId=state.masks[0].id;}
}
function save(){localStorage.setItem(SK,JSON.stringify(state.masks));localStorage.setItem(AK,state.activeId||'');}
function active(){return state.masks.find(function(m){return m.id===state.activeId;})||null;}

/* ---------- RENDER ---------- */
function renderMasks(){
  var c=$('maskList');c.innerHTML='';
  state.masks.forEach(function(m){
    var r=document.createElement('div');
    r.className='maskrow'+(m.id===state.editingId?' editing':'');
    r.innerHTML='<div><div class="t">'+esc(m.title)+'</div><div class="s">'+m.agents.length+' agent(s)</div></div><button>&#128465;</button>';
    r.onclick=function(){state.editingId=m.id;renderEditor();};
    r.querySelector('button').onclick=function(e){
      e.stopPropagation();
      if(!confirm('Delete "'+m.title+'"?'))return;
      state.masks=state.masks.filter(function(x){return x.id!==m.id;});
      if(state.activeId===m.id)state.activeId=state.masks.length?state.masks[0].id:null;
      if(state.editingId===m.id)state.editingId=null;
      save();renderMasks();renderPills();renderEditor();
    };
    c.appendChild(r);
  });
}
function renderPills(){
  var w=$('pills');w.innerHTML='';
  state.masks.forEach(function(m){
    var p=document.createElement('div');
    p.className='pill'+(m.id===state.activeId?' on':'');
    p.textContent=m.title;
    p.onclick=function(){state.activeId=m.id;save();renderPills();};
    w.appendChild(p);
  });
}
function renderEditor(){
  var m=state.masks.find(function(x){return x.id===state.editingId;});
  var s=$('editorSect');
  if(!m){s.style.display='none';renderMasks();return;}
  s.style.display='block';
  (′mTitle′).value=m.title;('mTitle').value=m.title;(′mTitle′).value=m.title;('mGlobal').value=m.globalPrompt;$('mKey').value=m.apiKey||'';
  renderAgents();
}
function renderAgents(){
  var m=state.masks.find(function(x){return x.id===state.editingId;});
  var c=$('agentsForm');c.innerHTML='';
  m.agents.forEach(function(a,i){
    var d=document.createElement('div');d.className='acard';
    var opts=state.models.map(function(mo){return '<option value="'+esc(mo)+'"'+(mo===a.model?' selected':'')+'>'+esc(mo)+'</option>';}).join('');
    d.innerHTML='<div class="achd"><span>AGENT '+(i+1)+'</span><button>&#60;</button></div>'+
      '<label>Agent Title</label><input class="at" value="'+esc(a.title)+'">'+
      '<label>Specific Instructions</label><textarea class="ai">'+esc(a.instructions)+'</textarea>'+
      '<label>Model</label><select class="am">'+opts+'</select>';
    d.querySelector('.at').oninput=function(e){a.title=e.target.value;};
    d.querySelector('.ai').oninput=function(e){a.instructions=e.target.value;};
    d.querySelector('.am').onchange=function(e){a.model=e.target.value;};
    d.querySelector('button').onclick=function(){m.agents=m.agents.filter(function(x){return x.id!==a.id;});renderAgents();};
    c.appendChild(d);
  });
  $('aCount').textContent=m.agents.length+' / '+MAXA+' agents';
  $('addAgentBtn').disabled=m.agents.length>=MAXA;
}

/* ---------- EDITOR EVENTS ---------- */
$('newMaskBtn').onclick=function(){
  if(state.masks.length>=MAXM){alert('Max '+MAXM+' masks.');return;}
  var m=defaultMask();m.id=uid();m.title='New Mask '+(state.masks.length+1);
  m.agents=[{id:uid(),title:'Agent 1',instructions:'',model:state.models[0]}];
  state.masks.push(m);state.editingId=m.id;state.activeId=m.id;save();renderMasks();renderPills();renderEditor();
};
$('saveMaskBtn').onclick=function(){
  var m=state.masks.find(function(x){return x.id===state.editingId;});
  if(!m)return;
  m.title=$('mTitle').value.trim()||'Untitled Mask';
  m.globalPrompt=$('mGlobal').value;
  m.apiKey=$('mKey').value.trim();
  if(!m.agents.length){alert('At least 1 agent required.');return;}
  state.editingId=null;save();renderMasks();renderPills();renderEditor();alert('Mask saved.');
};
$('addAgentBtn').onclick=function(){
  var m=state.masks.find(function(x){return x.id===state.editingId;});
  if(!m||m.agents.length>=MAXA)return;
  m.agents.push({id:uid(),title:'Agent '+(m.agents.length+1),instructions:'',model:state.models[0]});
  renderAgents();
};
$('syncBtn').onclick=async function(){
  var b=this;b.disabled=true;var o=b.innerHTML;b.innerHTML='Syncing...';
  try{
    var m=state.masks.find(function(x){return x.id===state.editingId;});
    var key=keyFor(m);
    if(!key)throw new Error('No API key set. Click "Set API Key" top-right first.');
    var r=await fetch('https://openrouter.ai/api/v1/models',{headers:{'Authorization':'Bearer '+key}});
    if(!r.ok)throw Error('HTTP '+r.status);
    var data=await r.json();
    var ids=(data.data||[]).map(function(x){return x.id;}).filter(Boolean).sort();
    if(!ids.length)throw new Error('No models returned');
    state.models=ids;alert('Synced '+ids.length+' models.');
  }catch(e){alert('Sync failed: '+e.message+'\nUsing default list.');}
  b.disabled=false;b.innerHTML=o;renderAgents();
};
('drawerToggle').onclick=function(){('drawer').classList.toggle('closed');};

/* ---------- ORCHESTRATION (direct to OpenRouter, parallel) ---------- */
$('sbtn').onclick=run;
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run();}});

async function run(){
  var pin=$('pin'),prompt=pin.value.trim();
  if(!prompt){alert('Enter a prompt.');return;}
  var mask=active();
  if(!mask||!mask.agents.length){alert('Select/create a Mask with agents first.');return;}
  var key=keyFor(mask);
  if(!key){alert('No API key found. Click "Set API Key" (top-right) once — it will be saved.');return;}

  var tr=(′transcript′);varem=('transcript');var em=(′transcript′);varem=('empty');if(em)em.remove();
  var ub=document.createElement('div');ub.className='ubub';ub.textContent=prompt;tr.appendChild(ub);
  var ld=document.createElement('div');ld.className='load';ld.textContent='\u26A1 Running '+mask.agents.length+' parallel agents...';tr.appendChild(ld);
  tr.scrollTop=tr.scrollHeight;
  pin.value='';$('sbtn').disabled=true;

  var jobs=mask.agents.map(function(a){
    return fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
      body:JSON.stringify({model:a.model,messages:[
        {role:'system',content:mask.globalPrompt+'\n\nYour Specific Role: '+a.instructions},
        {role:'user',content:prompt}
      ]})
    }).then(async function(r){
      var d=await r.json();
      if(!r.ok)return {agentTitle:a.title,model:a.model,output:'',error:(d.error&&d.error.message)||('HTTP '+r.status)};
      var c=d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:'';
      return {agentTitle:a.title,model:a.model,output:c||'',error:null};
    }).catch(function(e){return {agentTitle:a.title,model:a.model,output:'',error:e.message};});
  });

  var results=await Promise.all(jobs);
  ld.remove();$('sbtn').disabled=false;
  renderResults(tr,results);
  tr.scrollTop=tr.scrollHeight;
}

function renderResults(tr,results){
  var blk=document.createElement('div');blk.className='rblock';
  var tools=document.createElement('div');tools.className='rtools';
  var pb=document.createElement('button');pb.className='pdfbtn';pb.innerHTML='\uD83D\uDCE5 DOWNLOAD COMPLETE MULTI-PAGE PDF REPORT';
  pb.onclick=function(){pdf(blk);};
  tools.appendChild(pb);blk.appendChild(tools);
  var g=document.createElement('div');g.className='grid';
  results.forEach(function(r){
    var c=document.createElement('div');c.className='aout';
    c.innerHTML='<div class="tt">'+esc(r.agentTitle)+'</div><div class="mm">'+esc(r.model)+'</div><div class="bd">'+
      (r.error?'<div class="err">Error: '+esc(r.error)+'</div>':marked.parse(r.output||''))+'</div>';
    g.appendChild(c);
  });
  blk.appendChild(g);tr.appendChild(blk);
  if(window.mermaid){
    try{mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'loose'});
    mermaid.run({nodes:blk.querySelectorAll('.mermaid')}).catch(function(){});}catch(e){}
  }
}

async function pdf(blk){
  var clone=blk.cloneNode(true);
  var t=clone.querySelector('.rtools');if(t)t.remove();
  var w=document.createElement('div');
  w.innerHTML='<div style="text-align:center;border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:20px;"><h1 style="margin:0;font-size:22px;letter-spacing:2px;">MUTAYIEB DOSSIER REPORT</h1><div style="font-size:11px;color:#555;">Generated: '+new Date().toLocaleString()+'</div></div>';
  w.appendChild(clone);
  var st=document.createElement('style');
  st.textContent='#pdfw *{color:#111!important;background:transparent!important}#pdfw pre{background:#f4f4f4!important;border:1px solid #ddd}#pdfw code{background:#f4f4f4!important}#pdfw .aout{border:1px solid #ccc;border-radius:8px;padding:12px;margin-bottom:14px;page-break-inside:avoid}#pdfw .tt{color:#1d4ed8!important}#pdfw table{border-collapse:collapse;width:100%}#pdfw th,#pdfw td{border:1px solid #999;padding:4px 6px;font-size:11px}';
  w.id='pdfw';
  w.style.cssText='position:fixed;left:-9999px;top:0;width:800px;background:#fff;color:#111;font-family:Arial;font-size:12px;';
  w.appendChild(st);document.body.appendChild(w);
  try{
    await html2pdf().set({margin:[12,12,14,12],filename:'MUTAYIEB-Report.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(w).save();
  }finally{document.body.removeChild(w);}
}

/* ---------- INIT ---------- */
if(window.mermaid)mermaid.initialize({startOnLoad:false,theme:'dark',securityLevel:'loose'});
if(window.marked)marked.setOptions({breaks:true,gfm:true});
load();updKeyBtn();renderMasks();renderPills();renderEditor();
})();
</script>
</body>
</html>
